apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: sandbox
  name: webapp-sandbox
---
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>webapp</title></head>
      <body>
        <h1>webapp - BASE content</h1>
        <p>environment: base (overlays replace this page)</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: dso202-practical-05
    environment: sandbox
  name: sandbox-web-content-8kt8822t88
  namespace: webapp-sandbox
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: sandbox
  name: sandbox-webapp
  namespace: webapp-sandbox
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: sandbox
  name: sandbox-webapp
  namespace: webapp-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: webapp
        app.kubernetes.io/part-of: dso202-practical-05
        environment: sandbox
    spec:
      containers:
      - image: nginx:1.30-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: content
          readOnly: true
      volumes:
      - configMap:
          name: sandbox-web-content-8kt8822t88
        name: content
