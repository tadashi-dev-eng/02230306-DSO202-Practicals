apiVersion: v1
kind: Namespace
metadata:
  annotations:
    training.example.com/change-policy: cab-approved
  labels:
    environment: prod
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>webapp - PRODUCTION</title></head>
      <body>
        <h1>PRODUCTION environment</h1>
        <p>environment: prod</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  annotations:
    training.example.com/change-policy: cab-approved
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: dso202-practical-05
    environment: prod
  name: web-content-chb9cdd8k9
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    training.example.com/change-policy: cab-approved
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    training.example.com/change-policy: cab-approved
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: dso202-practical-05
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      annotations:
        training.example.com/change-policy: cab-approved
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: webapp
        app.kubernetes.io/part-of: dso202-practical-05
        environment: prod
    spec:
      containers:
      - image: nginx:1.30-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-chb9cdd8k9
        name: content
