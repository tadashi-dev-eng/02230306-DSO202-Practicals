# =============================================================================
# File    : examples/webapp/base/service.yaml
# Purpose : The ONE Service definition shared by every environment.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: webapp
  labels:
    app.kubernetes.io/name: webapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webapp
  ports:
    - name: http
      port: 80
      targetPort: http
